name: Update GodotJS

on:
  schedule:
    - cron: "0 9 * * 1,4" # Mon, Thu at 9am
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check for New Version
        id: check_version
        run: |
          REPO="godotjs/GodotJS"
          LATEST_TAG=$(curl -s "https://api.github.com/repos/$REPO/releases?per_page=1" | jq -r '.[0].tag_name')
          CURRENT_VERSION=$(grep -oP 'version = "\K[^"]+' flake.nix | head -1)

          echo "Latest upstream: $LATEST_TAG"
          echo "Current in flake: $CURRENT_VERSION"

          if [[ "$LATEST_TAG" == "$CURRENT_VERSION" ]]; then
            echo "Already up to date. Skipping update."
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "New version available: $LATEST_TAG"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Run Update Script
        if: steps.check_version.outputs.skip == 'false'
        id: update
        run: |
          chmod +x scripts/update-version.sh
          ./scripts/update-version.sh

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix package.nix

          echo "changes=true" >> $GITHUB_OUTPUT

      - name: No Changes
        if: steps.check_version.outputs.skip == 'true'
        run: echo "No changes needed. Exit."

      - name: Create Pull Request
        if: steps.update.outputs.changes == 'true'
        id: cpr # <--- Added ID so we can reference it later
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.MY_PAT }}
          commit-message: "chore: update GodotJS to ${{ steps.check_version.outputs.version }}"
          title: "chore: update GodotJS to ${{ steps.check_version.outputs.version }}"
          branch: auto-update/${{ steps.check_version.outputs.version }}
          delete-branch: true
          body: |
            Automated update to ${{ steps.check_version.outputs.version }}.

            Verified build success.

      - name: Enable Auto Merge
        if: steps.update.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Auto-merging PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --squash
